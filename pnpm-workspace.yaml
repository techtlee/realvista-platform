packages:
  - "packages/*"
  - "apps/*"
  # /create-website lives here: tooling, never deployed, not a package consumers install.
  - "tools/*"

# esbuild ships a prebuilt binary via a postinstall script; vitest needs it.
# pnpm 12 reads this here, not from package.json or .npmrc.
allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
